<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/logo.png"><title>GS-One Sign In</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020617;color:#e5e7eb;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(440px,calc(100vw - 32px));background:#0f172a;border:1px solid #26354f;border-radius:24px;padding:30px;box-shadow:0 30px 90px #0008}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;gap:12px;align-items:center}.brand img{width:38px;height:38px;border-radius:10px}.brand b{font-size:18px}.lang button,.tabs button{background:transparent;border:0;color:#94a3b8;padding:7px 10px;cursor:pointer}.lang button.active,.tabs button.active{color:#34d399}.tabs{display:flex;border-bottom:1px solid #26354f;margin-bottom:20px}.tabs button{flex:1;padding:12px}label{display:block;font-size:12px;color:#94a3b8;margin:14px 0 6px}input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #334155;background:#111c30;color:#fff;outline:none}input:focus{border-color:#10b981}.submit{width:100%;margin-top:20px;padding:12px;border:0;border-radius:12px;background:#10b981;color:#04130f;font-weight:800;cursor:pointer}.submit:disabled{opacity:.5}.err{min-height:20px;margin-top:12px;color:#fb7185;font-size:12px}.hint{font-size:11px;color:#64748b;margin-top:16px;line-height:1.5}.hidden{display:none}</style></head><body>
<div class="card"><div class="top"><div class="brand"><img src="/logo.png"><div><b>GS-One</b><div id="subtitle" style="font-size:11px;color:#64748b">AI Video Studio</div></div></div><div class="lang"><button id="zh">中文</button><button id="en">EN</button></div></div>
<div class="tabs"><button id="loginTab" class="active">Sign In</button><button id="registerTab">Create Account</button></div>
<form id="loginForm"><label id="idLabel">Username or email</label><input id="identifier" autocomplete="username" required><label id="pwLabel">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="submit" id="loginBtn">Sign In</button></form>
<form id="registerForm" class="hidden"><label id="userLabel">Username</label><input id="username" autocomplete="username" required><label id="emailLabel">Email (optional)</label><input id="email" type="email" autocomplete="email"><label id="newPwLabel">Password (8+ characters)</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required><button class="submit" id="registerBtn">Create Account</button></form>
<div class="err" id="error"></div><div class="hint" id="hint">Your session stays in this browser. API integrations should use API keys, not your password.</div></div><script src="/login.js"></script></body></html>
